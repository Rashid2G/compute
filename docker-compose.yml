name: compute

# Host networking is mandatory for computed and compute-worker: the daemon
# creates the sandbox bridge (mft3br0), TAP devices, NAT/iptables rules and a
# DNS responder in its network namespace. In bridge mode those objects live
# inside the container namespace, so host clients cannot reach guest IPs and
# DNS/port-forward answers are unusable. Host mode keeps them on the host.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-daemon-image: &daemon-image
  image: ${COMPUTE_DAEMON_IMAGE:-ghcr.io/rashid2g/compute-daemon}:${COMPUTE_VERSION:-1.0.0}
  pull_policy: ${COMPUTE_PULL_POLICY:-build}
  build:
    context: .
    dockerfile: Dockerfile.daemon

x-worker-image: &worker-image
  image: ${COMPUTE_WORKER_IMAGE:-ghcr.io/rashid2g/compute-worker}:${COMPUTE_VERSION:-1.0.0}
  pull_policy: ${COMPUTE_PULL_POLICY:-build}
  build:
    context: .
    dockerfile: Dockerfile.worker

x-data-volume: &data-volume
  ${COMPUTE_HOST_DATA_DIR:-./data}:/var/lib/compute

services:
  # One-shot bootstrap: installs the kernel, builds the Ubuntu 24.04 rootfs,
  # and generates the internal SSH key before the daemon starts. Idempotent.
  compute-init:
    <<: *daemon-image
    restart: "no"
    network_mode: host
    # Required to mount proc/sysfs/devpts during first-run rootfs chroot build.
    privileged: true
    logging: *default-logging
    volumes:
      - *data-volume
    environment:
      COMPUTE_DATA_DIR: ${COMPUTE_DATA_DIR:-/var/lib/compute}
      COMPUTE_IMAGES_DIR: ${COMPUTE_IMAGES_DIR:-/var/lib/compute/images}
      COMPUTE_IMAGES_MODE: ${COMPUTE_IMAGES_MODE:-auto}
      COMPUTE_IMAGE_MANIFEST_URL: ${COMPUTE_IMAGE_MANIFEST_URL:-}
      COMPUTE_IMAGE_ALLOW_HTTP: ${COMPUTE_IMAGE_ALLOW_HTTP:-}
      COMPUTE_KERNEL_SRC: ${COMPUTE_KERNEL_SRC:-}
      COMPUTE_KERNEL_URL: ${COMPUTE_KERNEL_URL:-}
      COMPUTE_KERNEL_SHA256: ${COMPUTE_KERNEL_SHA256:-}
      COMPUTE_ROOTFS_SIZE_MB: ${COMPUTE_ROOTFS_SIZE_MB:-2048}
      COMPUTE_ROOTFS_BUILDER: ${COMPUTE_ROOTFS_BUILDER:-}
      COMPUTE_DEFAULT_KERNEL: ${COMPUTE_DEFAULT_KERNEL:-vmlinux}
      COMPUTE_DEFAULT_ROOTFS: ${COMPUTE_DEFAULT_ROOTFS:-ubuntu-24.04.ext4}
      COMPUTE_SSH_KEY_PATH: ${COMPUTE_SSH_KEY_PATH:-/var/lib/compute/images/ssh/id_ed25519}
    entrypoint: ["/usr/local/bin/computed"]
    command: ["init", "--images"]

  computed:
    <<: *daemon-image
    restart: unless-stopped
    # Required for the sandbox bridge/TAP/NAT/DNS/edge objects to live on the
    # host instead of a private container network namespace.
    network_mode: host
    privileged: true
    # Manage host cgroups v2 (per-VM CPU/memory/pids limits) instead of the
    # container's private cgroup namespace, where controllers cannot be enabled.
    cgroup: host
    stop_grace_period: 30s
    logging: *default-logging
    ulimits:
      nofile: 65536
    depends_on:
      compute-init:
        condition: service_completed_successfully
    environment:
      COMPUTE_DATA_DIR: ${COMPUTE_DATA_DIR:-/var/lib/compute}
      COMPUTE_DB_PATH: ${COMPUTE_DB_PATH:-}
      COMPUTE_LISTEN: ${COMPUTE_LISTEN:-}
      COMPUTE_BIND_ADDRESS: ${COMPUTE_BIND_ADDRESS:-127.0.0.1}
      COMPUTE_API_PORT: ${COMPUTE_API_PORT:-18080}
      COMPUTE_FIRECRACKER_BIN: ${COMPUTE_FIRECRACKER_BIN:-}
      COMPUTE_AUTH_ENABLED: ${COMPUTE_AUTH_ENABLED:-true}
      COMPUTE_SIGNUP_ENABLED: ${COMPUTE_SIGNUP_ENABLED:-false}
      COMPUTE_ADMIN_USERNAME: ${COMPUTE_ADMIN_USERNAME:-admin}
      COMPUTE_ADMIN_EMAIL: ${COMPUTE_ADMIN_EMAIL:-admin@compute.local}
      # Use `-admin` (not `:-admin`) so explicitly leaving COMPUTE_ADMIN_PASSWORD=
      # empty in .env (e.g. when using COMPUTE_ADMIN_SECRET) is respected.
      COMPUTE_ADMIN_PASSWORD: ${COMPUTE_ADMIN_PASSWORD-admin}
      COMPUTE_ADMIN_SECRET: ${COMPUTE_ADMIN_SECRET:-}
      COMPUTE_TLS_CERT_FILE: ${COMPUTE_TLS_CERT_FILE:-}
      COMPUTE_TLS_KEY_FILE: ${COMPUTE_TLS_KEY_FILE:-}
      COMPUTE_PUBLIC_URL: ${COMPUTE_PUBLIC_URL:-}
      COMPUTE_SERVE_DOMAIN: ${COMPUTE_SERVE_DOMAIN:-}
      COMPUTE_SERVE_BIND: ${COMPUTE_SERVE_BIND:-127.0.0.1}
      COMPUTE_SERVE_PORT_START: ${COMPUTE_SERVE_PORT_START:-18400}
      COMPUTE_SERVE_PORT_END: ${COMPUTE_SERVE_PORT_END:-18500}
      COMPUTE_SERVE_TLS_CERT_FILE: ${COMPUTE_SERVE_TLS_CERT_FILE:-}
      COMPUTE_SERVE_TLS_KEY_FILE: ${COMPUTE_SERVE_TLS_KEY_FILE:-}
      COMPUTE_SERVE_TOKEN_KEY: ${COMPUTE_SERVE_TOKEN_KEY:-}
      COMPUTE_EDGE_LISTEN: ${COMPUTE_EDGE_LISTEN:-}
      COMPUTE_CGROUP_ENFORCE: ${COMPUTE_CGROUP_ENFORCE:-}
      COMPUTE_JAILER_ENABLED: ${COMPUTE_JAILER_ENABLED:-}
      COMPUTE_JAILER_BIN: ${COMPUTE_JAILER_BIN:-}
      COMPUTE_JAILER_DIR: ${COMPUTE_JAILER_DIR:-}
      COMPUTE_ALLOW_UNREADY_STARTUP: ${COMPUTE_ALLOW_UNREADY_STARTUP:-}
      COMPUTE_DEPLOYMENTS_INDEX: ${COMPUTE_DEPLOYMENTS_INDEX:-}
      COMPUTE_DNS_ENABLED: ${COMPUTE_DNS_ENABLED:-false}
      COMPUTE_DNS_LISTEN: ${COMPUTE_DNS_LISTEN:-}
      COMPUTE_DNS_BASE_DOMAIN: ${COMPUTE_DNS_BASE_DOMAIN:-${COMPUTE_DOMAIN:-}}
      COMPUTE_DNS_EXTRA_BASE_DOMAINS: ${COMPUTE_DNS_EXTRA_BASE_DOMAINS:-}
      COMPUTE_DNS_HOST_ADDRESSES: ${COMPUTE_DNS_HOST_ADDRESSES:-}
      COMPUTE_DEFAULT_VCPUS: ${COMPUTE_DEFAULT_VCPUS:-}
      COMPUTE_DEFAULT_MEMORY_MB: ${COMPUTE_DEFAULT_MEMORY_MB:-}
      COMPUTE_DEFAULT_DISK_MB: ${COMPUTE_DEFAULT_DISK_MB:-}
      COMPUTE_DEFAULT_IMAGE: ${COMPUTE_DEFAULT_IMAGE:-}
      COMPUTE_IMAGES_DIR: ${COMPUTE_IMAGES_DIR:-}
      COMPUTE_VMS_DIR: ${COMPUTE_VMS_DIR:-}
      COMPUTE_DEFAULT_KERNEL: ${COMPUTE_DEFAULT_KERNEL:-vmlinux}
      COMPUTE_DEFAULT_ROOTFS: ${COMPUTE_DEFAULT_ROOTFS:-ubuntu-24.04.ext4}
      COMPUTE_SSH_KEY_PATH: ${COMPUTE_SSH_KEY_PATH:-}
      COMPUTE_NETWORK_MODE: ${COMPUTE_NETWORK_MODE:-}
      COMPUTE_BRIDGE_NAME: ${COMPUTE_BRIDGE_NAME:-}
      COMPUTE_BRIDGE_IP: ${COMPUTE_BRIDGE_IP:-}
      COMPUTE_SUBNET: ${COMPUTE_SUBNET:-}
      COMPUTE_GATEWAY_IP: ${COMPUTE_GATEWAY_IP:-}
      COMPUTE_PHYSICAL_NIC: ${COMPUTE_PHYSICAL_NIC:-}
      COMPUTE_NETWORK_BASE_DOMAIN: ${COMPUTE_NETWORK_BASE_DOMAIN:-}
      COMPUTE_LINKED_BRIDGES: ${COMPUTE_LINKED_BRIDGES:-}
      COMPUTE_LINK_OTHER_BRIDGES: ${COMPUTE_LINK_OTHER_BRIDGES:-}
      COMPUTE_MAX_RUNNING_VMS: ${COMPUTE_MAX_RUNNING_VMS:-}
      COMPUTE_MAX_TOTAL_VCPUS: ${COMPUTE_MAX_TOTAL_VCPUS:-}
      COMPUTE_MAX_TOTAL_MEMORY_MB: ${COMPUTE_MAX_TOTAL_MEMORY_MB:-}
      COMPUTE_MAX_TOTAL_DISK_MB: ${COMPUTE_MAX_TOTAL_DISK_MB:-}
      COMPUTE_MIN_FREE_DISK_MB: ${COMPUTE_MIN_FREE_DISK_MB:-}
      COMPUTE_JOBS_LOCAL_EXECUTION: ${COMPUTE_JOBS_LOCAL_EXECUTION:-}
      COMPUTE_JOBS_MAX_CONCURRENT: ${COMPUTE_JOBS_MAX_CONCURRENT:-}
      COMPUTE_JOBS_BOOT_TIMEOUT_SECONDS: ${COMPUTE_JOBS_BOOT_TIMEOUT_SECONDS:-}
      # Defensive marker: the daemon warns if it detects a private container
      # network namespace while this is unset.
      COMPUTE_HOST_NETWORK: "1"
    volumes:
      - *data-volume
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /dev/kvm:/dev/kvm
    devices:
      - /dev/kvm:/dev/kvm
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://${COMPUTE_HEALTHCHECK_HOST:-127.0.0.1}:${COMPUTE_API_PORT:-18080}/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Optional separate GUI container. The daemon already serves the embedded UI
  # on its API port; use this only when you want a dedicated :8080 listener.
  compute-gui:
    <<: *daemon-image
    profiles: ["gui"]
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    depends_on:
      computed:
        condition: service_healthy
    environment:
      COMPUTE_ADMIN_SECRET: ${COMPUTE_ADMIN_SECRET:-}
      COMPUTE_API_KEY: ${COMPUTE_API_KEY:-}
    entrypoint:
      - /usr/local/bin/compute
      - gui
      - --addr
      - ${COMPUTE_GUI_BIND_ADDRESS:-127.0.0.1}
      - --port
      - ${COMPUTE_GUI_PORT:-8080}
      - --daemon
      - http://127.0.0.1:${COMPUTE_API_PORT:-18080}
    command: []

  # Optional multi-host worker. Experimental: keep this out of the default
  # single-host install; the control plane runs local VMs by default.
  compute-worker:
    <<: *worker-image
    profiles: ["worker"]
    restart: unless-stopped
    network_mode: host
    privileged: true
    cgroup: host
    stop_grace_period: 30s
    logging: *default-logging
    ulimits:
      nofile: 65536
    depends_on:
      computed:
        condition: service_healthy
    environment:
      COMPUTE_CONTROL_PLANE: ${COMPUTE_CONTROL_PLANE:-http://127.0.0.1:${COMPUTE_API_PORT:-18080}}
      COMPUTE_WORKER_ID: ${COMPUTE_WORKER_ID:-}
      COMPUTE_WORKER_TOKEN: ${COMPUTE_WORKER_TOKEN:-}
      COMPUTE_WORKER_NAME: ${COMPUTE_WORKER_NAME:-docker-worker}
      COMPUTE_POOL_ID: ${COMPUTE_POOL_ID:-default}
      COMPUTE_WORKER_STATE_DIR: ${COMPUTE_WORKER_STATE_DIR:-/var/lib/compute-worker}
      COMPUTE_FIRECRACKER_BIN: ${COMPUTE_FIRECRACKER_BIN:-}
      COMPUTE_CGROUP_ENFORCE: ${COMPUTE_CGROUP_ENFORCE:-}
      COMPUTE_IMAGES_DIR: ${COMPUTE_IMAGES_DIR:-/var/lib/compute/images}
      COMPUTE_VMS_DIR: ${COMPUTE_VMS_DIR:-/var/lib/compute-worker/vms}
      COMPUTE_SSH_KEY_PATH: ${COMPUTE_SSH_KEY_PATH:-/var/lib/compute/images/ssh/id_ed25519}
      COMPUTE_DEFAULT_KERNEL: ${COMPUTE_DEFAULT_KERNEL:-vmlinux}
      COMPUTE_DEFAULT_ROOTFS: ${COMPUTE_DEFAULT_ROOTFS:-ubuntu-24.04.ext4}
      COMPUTE_NETWORK_MODE: ${COMPUTE_NETWORK_MODE:-}
      COMPUTE_BRIDGE_NAME: ${COMPUTE_BRIDGE_NAME:-mft3br0}
      COMPUTE_BRIDGE_IP: ${COMPUTE_BRIDGE_IP:-}
      COMPUTE_SUBNET: ${COMPUTE_SUBNET:-}
      COMPUTE_GATEWAY_IP: ${COMPUTE_GATEWAY_IP:-}
      COMPUTE_WORKER_BOOT_TIMEOUT_SECONDS: ${COMPUTE_WORKER_BOOT_TIMEOUT_SECONDS:-}
      COMPUTE_WORKER_ALLOW_LOCAL_EXEC: ${COMPUTE_WORKER_ALLOW_LOCAL_EXEC:-}
    command: ["run"]
    volumes:
      - worker-data:/var/lib/compute-worker
      - ${COMPUTE_HOST_DATA_DIR:-./data}/images:/var/lib/compute/images:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /dev/kvm:/dev/kvm
    devices:
      - /dev/kvm:/dev/kvm
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /usr/local/bin/compute-worker >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Local development helper: builds the daemon image with the working tree and
  # prints its version. The default install builds/uses the pinned image via
  # COMPUTE_VERSION; the dev profile is for exercising local changes.
  compute-dev:
    <<: *daemon-image
    profiles: ["dev"]
    network_mode: host
    logging: *default-logging
    entrypoint: ["/usr/local/bin/computed"]
    command: ["version"]

volumes:
  worker-data:
