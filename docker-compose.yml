version: '3.8'

services:
  computed:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: computed
    hostname: computed
    restart: unless-stopped
    privileged: true
    # Manage host cgroups v2 (per-VM CPU/memory/pids limits) instead of the
    # container's private cgroup namespace, where controllers cannot be enabled.
    cgroup: host
    ports:
      - "18080:18080"
      # Edge listener: zone apex + reserved "api" subdomain on HTTP :80.
      # Bound to specific host addresses because systemd-resolved occupies
      # the wildcard DNS port space with loopback listeners.
      - "192.168.1.70:80:80"
      - "100.78.129.96:80:80"
      # Authoritative DNS responder for the base domain (sandbox SSH names).
      - "192.168.1.70:53:53/udp"
      - "192.168.1.70:53:53/tcp"
      - "100.78.129.96:53:53/udp"
      - "100.78.129.96:53:53/tcp"
    volumes:
      - ${COMPUTE_DATA_DIR:-./data}:/var/lib/compute
      - ./config:/etc/compute:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /dev/kvm:/dev/kvm
      # Host tailscaled control socket: the daemon runs `tailscale serve` for
      # per-sandbox Services, and tailscaled (on the host) forwards Service
      # traffic to the daemon's local gateway listeners.
      - /var/run/tailscale:/var/run/tailscale
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      - COMPUTE_DATA_DIR=/var/lib/compute
      - COMPUTE_DAEMON=0.0.0.0:18080
      # Tailscale integration. The API key is supplied by the untracked
      # ${COMPUTE_DIR:-.}/.env file (see scripts/deploy.sh, which excludes it
      # from --delete-after syncs). Never commit the key to daemon.json.
      - COMPUTE_TAILSCALE_ENABLED=${COMPUTE_TAILSCALE_ENABLED:-true}
      - COMPUTE_TAILSCALE_API_KEY=${COMPUTE_TAILSCALE_API_KEY:-}
      - COMPUTE_TAILSCALE_TAILNET=${COMPUTE_TAILSCALE_TAILNET:--}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  compute-gui:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: compute-gui
    restart: unless-stopped
    depends_on:
      computed:
        condition: service_healthy
    ports:
      - "8080:8080"
    entrypoint: ["/usr/local/bin/compute", "gui", "--addr", "0.0.0.0", "--port", "8080", "--daemon", "http://computed:18080"]

  compute-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: compute-worker
    restart: unless-stopped
    depends_on:
      computed:
        condition: service_healthy
    privileged: true
    volumes:
      - /dev/kvm:/dev/kvm
      - worker-data:/var/lib/compute-worker
    environment:
      - COMPUTE_CONTROL_PLANE=http://computed:18080
      - COMPUTE_WORKER_NAME=docker-worker-primary
      - COMPUTE_WORKER_POOL=default
    command: ["run", "--control-plane", "http://computed:18080", "--name", "docker-worker-primary", "--pool", "default"]

volumes:
  worker-data:
