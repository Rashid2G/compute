version: '3.8'

services:
  computed:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: computed
    hostname: computed
    restart: unless-stopped
    privileged: true
    # Manage host cgroups v2 (per-VM CPU/memory/pids limits) instead of the
    # container's private cgroup namespace, where controllers cannot be enabled.
    cgroup: host
    ports:
      - "18080:18080"
    volumes:
      - ${COMPUTE_DATA_DIR:-./data}:/var/lib/compute
      - ./config:/etc/compute:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /dev/kvm:/dev/kvm
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      - COMPUTE_DATA_DIR=/var/lib/compute
      - COMPUTE_DAEMON=0.0.0.0:18080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  compute-gui:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: compute-gui
    restart: unless-stopped
    depends_on:
      computed:
        condition: service_healthy
    ports:
      - "8080:8080"
    entrypoint: ["/usr/local/bin/compute", "gui", "--addr", "0.0.0.0", "--port", "8080", "--daemon", "http://computed:18080"]

  compute-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: compute-worker
    restart: unless-stopped
    depends_on:
      computed:
        condition: service_healthy
    privileged: true
    volumes:
      - /dev/kvm:/dev/kvm
      - worker-data:/var/lib/compute-worker
    environment:
      - COMPUTE_CONTROL_PLANE=http://computed:18080
      - COMPUTE_WORKER_NAME=docker-worker-primary
      - COMPUTE_WORKER_POOL=default
    command: ["run", "--control-plane", "http://computed:18080", "--name", "docker-worker-primary", "--pool", "default"]

volumes:
  worker-data:
