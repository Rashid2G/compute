name: Installer validation

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go tests (config, images, doctor, db, worker, daemon)
        run: |
          go test ./internal/config/... ./internal/image/... ./internal/doctor/... \
            ./internal/db/... ./internal/worker/... ./cmd/computed/...

      - name: Validate compose installer surface
        run: ./scripts/validate-compose.sh

      - name: ShellCheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/preflight.sh scripts/host-prepare.sh \
              scripts/setup-host.sh scripts/validate-compose.sh
          else
            echo "shellcheck not installed; skipping"
          fi
