[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-sdk"
version = "1.0.0"
authors = [
  { name="Compute Team", email="dev@compute.local" },
]
description = "Official Python SDK for Compute Sandboxes"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
"Homepage" = "https://github.com/Rashid2G/on-demand-vms"
